name: conformance
on:
  push: { branches: [main] }
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        working-directory: tools/vio-lint
        run: npm install
      - name: Run the conformance suite
        working-directory: tools/vio-lint
        run: npm test
