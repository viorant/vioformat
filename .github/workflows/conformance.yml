name: conformance
on:
  push: { branches: [main] }
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # The schema and the fixtures are generated from the reference
      # implementation, which is not reachable from public CI. So CI cannot
      # re-derive them — it checks them from the other side instead: the
      # committed fixtures are validated against the committed schema by the
      # conformance suite, which fails if either has been edited by hand into
      # disagreement. Re-derivation is verified in the generator's own repo.
      - name: Install
        working-directory: tools/vio-lint
        run: npm install

      - name: Conformance suite
        working-directory: tools/vio-lint
        run: npm run conformance

      # Skips cleanly when the reference implementation is absent, which is
      # always the case in public CI. It is the check that matters most, so it
      # runs wherever it can.
      - name: Parity with the reference implementation
        working-directory: tools/vio-lint
        run: npm run parity

      - name: Generated files are not hand-edited
        run: |
          if grep -q '"x-generated-from"' schema/v1/vio.schema.json; then
            echo "✓ schema carries its provenance stamp"
          else
            echo "✕ schema/v1/vio.schema.json has lost its provenance stamp — it must be generated by tools/sync-schema.mjs"
            exit 1
          fi
